<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="lobby">
      <h1>UNO TV</h1>
      <div id="create-section">
        <button id="create-btn">Create Room (for TV)</button>
      </div>
      <div id="join-section">
        <input type="text" id="name-input" placeholder="Your name" maxlength="12">
        <input type="text" id="code-input" placeholder="Room code" maxlength="4" style="text-transform: uppercase;">
        <button id="join-btn">Join as Player</button>
      </div>
      <div id="room-info" style="display:none;">
        <h2>Room: <span id="room-code"></span></h2>
        <p>On phones, go to: <span id="phone-url"></span></p>
        <div id="players-list"></div>
        <button id="start-btn" style="display:none;">Start Game</button>
      </div>
    </div>

    <div id="game" style="display:none;">
      <div id="tv-view">
        <div id="status"></div>
        <div id="discard-area">
          <div id="discard-card" class="card"></div>
          <div id="color-indicator"></div>
        </div>
        <div id="players-status"></div>
        <div id="direction"></div>
      </div>
      <div id="player-view" style="display:none;">
        <div id="hand"></div>
        <div id="actions">
          <button id="draw-btn">Draw Card</button>
          <button id="uno-btn">Call UNO!</button>
        </div>
        <div id="color-picker" style="display:none;">
          <p>Choose color:</p>
          <button class="color-btn" data-color="red">Red</button>
          <button class="color-btn" data-color="yellow">Yellow</button>
          <button class="color-btn" data-color="green">Green</button>
          <button class="color-btn" data-color="blue">Blue</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
